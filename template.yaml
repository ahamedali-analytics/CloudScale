AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudScale serverless distributed data processing and workload management system

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        DATA_BUCKET: !Ref JobDataBucket
        JOB_QUEUE_URL: !Ref JobQueue

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  JobDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 5

  SubmitJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/submit_job/
      Handler: app.lambda_handler
      Timeout: 15
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
        - S3WritePolicy:
            BucketName: !Ref JobDataBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
      Events:
        SubmitJob:
          Type: Api
          Properties:
            Path: /jobs
            Method: post

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/worker/
      Handler: app.lambda_handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3ReadPolicy:
            BucketName: !Ref JobDataBucket
        - S3WritePolicy:
            BucketName: !Ref JobDataBucket
      Events:
        JobQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/get_job/
      Handler: app.lambda_handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - S3ReadPolicy:
            BucketName: !Ref JobDataBucket
      Events:
        GetJob:
          Type: Api
          Properties:
            Path: /jobs/{jobId}
            Method: get

Outputs:
  ApiUrl:
    Description: Base URL for the CloudScale REST API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  JobsTableName:
    Value: !Ref JobsTable
  JobQueueUrl:
    Value: !Ref JobQueue
  DataBucketName:
    Value: !Ref JobDataBucket
